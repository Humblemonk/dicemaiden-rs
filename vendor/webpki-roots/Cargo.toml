# Vendored copy of webpki-roots 1.0.10 with every emSign root removed. Applied via
# [patch.crates-io] in the top-level Cargo.toml; see README.md in this directory.
[package]
name = "webpki-roots"
version = "1.0.10"
edition = "2021"
rust-version = "1.71"
license = "CDLA-Permissive-2.0"
description = "Mozilla's CA root certificates for use with webpki (emSign roots removed)"
publish = false

[dependencies]
pki-types = { package = "rustls-pki-types", version = "1.8", default-features = false }
