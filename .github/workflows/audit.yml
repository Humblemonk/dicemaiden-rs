name: Security audit

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories that are unreachable from this bot are suppressed, with the
      # reasoning for each, in .cargo/audit.toml — which cargo-audit reads from the
      # checkout root. Keep suppressions there, not in an `ignore:` input here, so
      # the justification travels with the entry.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
